<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futebol Brasileirão Série A</title>
    <link rel="icon" href="/images/icon.png" type="image/png">
    <link rel="stylesheet" href="/styles/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <button class="toggle-dark" id="toggle-dark" title="Alternar modo escuro/claro">🌙</button>
    <div class="container">
        <nav>
            <ul>
                <li><a href="#tabela" class="active">Tabela</a></li>
                <li><a href="#jogos">Jogos</a></li>
                <li><a href="/clube.html">Meu Clube</a></li>
            </ul>
        </nav>

        <!-- Seção da Tabela -->
        <section id="tabela">
            <h1 id="titulo-tabela">Brasileirão Série A</h1>
            <div id="loading-table" class="status-box" style="display:none;">Carregando tabela...</div>
            <div id="table-message" class="status-box" style="display:none;"></div>
            <table id="standings-table" style="display:none;">
                <thead>
                    <tr>
                        <th></th>
                        <th>Equipe</th>
                        <th>Histórico</th>
                        <th>Pontos</th>
                        <th>J</th>
                        <th>V</th>
                        <th>E</th>
                        <th>D</th>
                        <th>GP</th>
                        <th>GC</th>
                        <th>SG</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <!-- Seção dos Jogos -->
        <section id="jogos">
            <div id="jogos-message" class="status-box" style="display:none;"></div>
            <div class="columns" id="jogos-columns">
                <section id="last">
                    <h2>Última rodada</h2>
                    <div id="loading-last" class="status-box" style="display:none;">Carregando jogos...</div>
                    <div class="games-list" id="last-list"></div>
                </section>
                <section id="today">
                    <h2>Rodada Atual</h2>
                    <div id="loading-today" class="status-box" style="display:none;">Carregando jogos...</div>
                    <div class="games-list" id="today-list"></div>
                </section>
                <section id="next">
                    <h2>Próxima Rodada</h2>
                    <div id="loading-next" class="status-box" style="display:none;">Carregando jogos...</div>
                    <div class="games-list" id="next-list"></div>
                </section>
            </div>
        </section>
    </div>

    <script src="/scripts/theme.js"></script>
    <script src="/scripts/render.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Tabela ---
            const loadingTable = document.getElementById('loading-table');
            const tableMessage = document.getElementById('table-message');
            const standingsTable = document.getElementById('standings-table');

            loadingTable.style.display = 'block';
            fetch('/api/standings')
                .then((response) => response.json())
                .then((data) => {
                    loadingTable.style.display = 'none';

                    if (!data.started) {
                        tableMessage.textContent = data.message || 'A temporada ainda não começou.';
                        tableMessage.style.display = 'block';
                        return;
                    }

                    document.getElementById('titulo-tabela').textContent = `Brasileirão Série A ${data.season}`;
                    standingsTable.style.display = 'table';
                    renderStandingsTable(data.table, document.querySelector('#standings-table tbody'));
                })
                .catch((error) => {
                    loadingTable.style.display = 'none';
                    tableMessage.textContent = 'Erro ao buscar dados da tabela. Tente novamente mais tarde.';
                    tableMessage.style.display = 'block';
                    console.error('Erro ao buscar dados da tabela:', error);
                });

            // --- Jogos (última / atual / próxima rodada) ---
            const jogosMessage = document.getElementById('jogos-message');
            const jogosColumns = document.getElementById('jogos-columns');
            ['last', 'today', 'next'].forEach((id) => {
                document.getElementById(`loading-${id}`).style.display = 'block';
            });

            fetch('/api/matches')
                .then((response) => response.json())
                .then((data) => {
                    ['last', 'today', 'next'].forEach((id) => {
                        document.getElementById(`loading-${id}`).style.display = 'none';
                    });

                    if (!data.started) {
                        jogosColumns.style.display = 'none';
                        jogosMessage.textContent = data.message || 'Nenhuma rodada disponível.';
                        jogosMessage.style.display = 'block';
                        return;
                    }

                    renderGamesList(data.last, document.getElementById('last-list'));
                    renderGamesList(data.today, document.getElementById('today-list'));
                    renderGamesList(data.next, document.getElementById('next-list'));
                })
                .catch((error) => {
                    ['last', 'today', 'next'].forEach((id) => {
                        document.getElementById(`loading-${id}`).style.display = 'none';
                    });
                    jogosMessage.textContent = 'Erro ao carregar jogos. Tente novamente mais tarde.';
                    jogosMessage.style.display = 'block';
                    console.error('Erro ao carregar jogos:', error);
                });
        });
    </script>
</body>
</html>
